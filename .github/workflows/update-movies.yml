name: Update Malayalam Movies List

on:
  schedule:
    # Runs at 00:00 UTC and 12:00 UTC every day
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Needed to commit changes back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Using a newer version for native fetch support

      - name: Run scraper script
        run: node scrape.js

      - name: Commit and Push changes
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only commit if there are changes
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git add README.md
            git commit -m "docs: automated update of Malayalam movie list"
            git push
            echo "Successfully updated README.md"
          else
            echo "No new movies found, README.md is up to date."
          fi
