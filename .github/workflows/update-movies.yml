name: Update Malayalam Movies List

on:
  schedule:
    # Runs once daily at 2:00 AM IST (20:30 UTC)
    - cron: '30 20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Needed to commit changes back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run scraper script
        run: node scrape.js

      - name: Commit and Push changes
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only commit if there are changes
          if [[ -n "$(git status --porcelain posters.json data.json)" ]]; then
            git add posters.json data.json
            git commit -m "docs: automated update of Malayalam movie list"
            git push
            echo "Successfully updated README.md"
          else
            echo "No new movies found, README.md is up to date."
          fi
