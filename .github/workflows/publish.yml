name: Update releases and publish Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      refresh_top:
        description: Force a refresh of TOP RELEASES THIS WEEK
        type: boolean
        default: true

concurrency:
  group: release-publishing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test && npm run check
      - name: Refresh release data
        env:
          REFRESH_TOP: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_top }}
        run: |
          if [ "$REFRESH_TOP" = "true" ]; then
            npm run update -- --refresh-top
          else
            npm run update
          fi
      - name: Commit changed data
        id: commit
        run: |
          if git diff --quiet -- movies.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add movies.json
            git commit -m "Update Malayalam releases" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: update
    if: >-
      always() && (needs.update.result == 'skipped' ||
      (needs.update.result == 'success' && needs.update.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test && npm run check
      - uses: actions/configure-pages@v5
      - name: Test mobile UI
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html styles.css app.js catalog.js movies.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
