<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Latest Malayalam Movies</title>
<meta name="description" content="Browse the latest Malayalam movie releases with posters and download links." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--surface:#14141f;--border:#1e1e2e;
  --text:#e2e2ef;--text-dim:#8888a4;--accent:#7c5cfc;
  --accent-glow:rgba(124,92,252,.25);
  --card-radius:12px;
}
html{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;padding:0 0 3rem}

/* ── Header ────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(10,10,15,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:1rem 1.25rem;
  display:flex;align-items:center;justify-content:space-between;
}
header h1{font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
header h1 span{color:var(--accent)}
.badge{font-size:.7rem;background:var(--accent);color:#fff;padding:2px 8px;border-radius:20px;font-weight:600}
.updated{font-size:.7rem;color:var(--text-dim);padding:.35rem 1.25rem;text-align:right}

/* ── Search ────────────────────────────────────── */
.search-bar{padding:0 1rem .75rem}
.search-bar input{
  width:100%;padding:.65rem 1rem .65rem 2.5rem;
  border:1px solid var(--border);border-radius:10px;
  background:var(--surface);color:var(--text);
  font-size:.9rem;outline:none;transition:border-color .2s;
}
.search-bar input:focus{border-color:var(--accent)}
.search-bar{position:relative}
.search-bar::before{
  content:'🔍';position:absolute;left:1.75rem;top:50%;transform:translateY(-50%);
  font-size:.85rem;pointer-events:none;
}

/* ── Grid ──────────────────────────────────────── */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.6rem;
  padding:.75rem 1rem;
}
@media(min-width:480px){.grid{grid-template-columns:repeat(4,1fr);gap:.75rem;padding:1rem}}
@media(min-width:768px){.grid{grid-template-columns:repeat(5,1fr);gap:1rem;padding:1rem 1.5rem}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(6,1fr);padding:1.25rem 2rem}}
@media(min-width:1400px){.grid{grid-template-columns:repeat(8,1fr)}}

/* ── Card ──────────────────────────────────────── */
.card{
  display:flex;flex-direction:column;
  text-decoration:none;color:var(--text);
  border-radius:var(--card-radius);
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  transition:transform .2s ease,box-shadow .25s ease,border-color .25s ease;
  will-change:transform;
}
.card:hover,.card:focus-visible{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 8px 30px var(--accent-glow);
  border-color:var(--accent);
}
.poster-wrap{
  position:relative;width:100%;
  aspect-ratio:2/3;
  background:linear-gradient(145deg,#1a1a2e,#10101c);
  overflow:hidden;
}
.poster-wrap img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .3s ease;
}
.card:hover .poster-wrap img{transform:scale(1.05)}
.placeholder-icon{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:2.5rem;opacity:.35;
}
.title{
  padding:.45rem .5rem .55rem;
  font-size:.72rem;font-weight:500;
  line-height:1.3;
  text-align:center;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
@media(min-width:480px){.title{font-size:.78rem;padding:.5rem .6rem .6rem}}

/* ── Loading / Empty ───────────────────────────── */
.status{
  text-align:center;padding:4rem 1rem;color:var(--text-dim);
  font-size:.95rem;
}
.status.hidden{display:none}

/* ── Scrollbar ─────────────────────────────────── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── Animations ────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{animation:fadeUp .35s ease both}
</style>
</head>
<body>

<header>
  <h1>🎬 <span>Malayalam</span> Movies</h1>
  <span class="badge" id="count">…</span>
</header>
<p class="updated" id="updated"></p>

<div class="search-bar">
  <input type="search" id="search" placeholder="Search movies…" autocomplete="off" />
</div>

<div class="grid" id="grid"></div>

<p class="status" id="loading">Loading movies…</p>
<p class="status hidden" id="empty">No movies match your search.</p>

<script>
(async () => {
  const grid = document.getElementById('grid');
  const loading = document.getElementById('loading');
  const empty = document.getElementById('empty');
  const search = document.getElementById('search');
  const badge = document.getElementById('count');
  const updated = document.getElementById('updated');

  try {
    const res = await fetch('data.json?v=' + Date.now());
    const data = await res.json();

    badge.textContent = `${data.count} titles`;
    updated.textContent = `Updated ${data.updated}`;
    loading.classList.add('hidden');

    // Render cards
    const fragment = document.createDocumentFragment();
    data.movies.forEach((m, i) => {
      const a = document.createElement('a');
      a.href = m.url || '#';
      a.className = 'card';
      a.target = '_blank';
      a.rel = 'noopener';
      a.style.animationDelay = Math.min(i * 30, 600) + 'ms';

      const wrap = document.createElement('div');
      wrap.className = 'poster-wrap';
      if (m.poster) {
        const img = document.createElement('img');
        img.src = m.poster;
        img.alt = m.title;
        img.loading = 'lazy';
        wrap.appendChild(img);
      } else {
        const ph = document.createElement('div');
        ph.className = 'placeholder-icon';
        ph.textContent = '🎬';
        wrap.appendChild(ph);
      }
      a.appendChild(wrap);

      const p = document.createElement('p');
      p.className = 'title';
      p.textContent = m.title;
      a.appendChild(p);

      fragment.appendChild(a);
    });
    grid.appendChild(fragment);

    // Search
    const cards = [...grid.querySelectorAll('.card')];
    search.addEventListener('input', () => {
      const q = search.value.toLowerCase().trim();
      let vis = 0;
      cards.forEach(c => {
        const show = c.querySelector('.title').textContent.toLowerCase().includes(q);
        c.style.display = show ? '' : 'none';
        if (show) vis++;
      });
      empty.classList.toggle('hidden', vis > 0);
    });

  } catch (err) {
    loading.textContent = 'Failed to load movie data.';
    console.error(err);
  }
})();
</script>
</body>
</html>
