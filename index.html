<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10140f">
    <meta name="description" content="Malayalam movies and TV shows. This week's top releases and recently added titles, with posters and automatic updates.">
    <title>Malayalam Watchlist</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#results">Skip to releases</a>
    <main>
      <header>
        <h1 class="wordmark"><span class="brand-icon" aria-hidden="true">M</span> MALAYALAM WATCHLIST</h1>
      </header>

      <section class="browse" aria-label="Browse releases">
        <div class="search-wrap">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
          <label class="visually-hidden" for="search">Search movies and TV shows</label>
          <input id="search" type="search" placeholder="Find your next watch" autocomplete="off" enterkeyhint="search">
        </div>
        <div class="type-filters" role="group" aria-label="Release type">
          <button data-type="all" aria-pressed="true">All <span id="all-count"></span></button>
          <button data-type="movie" aria-pressed="false">Movies <span id="movie-count"></span></button>
          <button data-type="tv_show" aria-pressed="false">TV shows <span id="tv-count"></span></button>
        </div>
      </section>

      <section id="results" aria-labelledby="results-heading" tabindex="-1">
        <div class="results-header">
          <h2 id="results-heading">Releases</h2>
          <span id="result-count" role="status" aria-live="polite"></span>
        </div>
        <p id="warning" class="notice" role="status" hidden></p>
        <div id="loading" class="loading" role="status">Finding your next watch...</div>
        <div id="error" class="notice error" role="alert" hidden>
          <p id="error-message"></p>
          <button id="retry">Try again</button>
        </div>
        <div id="cards" class="cards"></div>
        <div id="empty" class="empty" hidden>
          <h3>No matches just yet.</h3>
          <p>Try a different title or switch your filters.</p>
        </div>
      </section>
      <footer>
        <p id="updated">Loading latest releases...</p>
        <p id="top-updated" hidden></p>
        <p>Malayalam audio, including dubbed titles.</p>
        <p>New releases checked hourly. Top picks refreshed daily.</p>
        <a href="./movies.json">View JSON data</a>
      </footer>
    </main>
  </body>
</html>
